[project]
name = "metric-helpdesk"
version = "1.0.0"
description = "Ask questions about your metrics in plain English, answered only through a MetricForge semantic layer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9",
    "duckdb>=1.4",
    "mcp>=2.2",
    "metricforge @ git+https://github.com/m4dd0ck/metricforge@v0.1.0",
    "pydantic>=2.9",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
metric-helpdesk = "metric_helpdesk.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "ruff>=0.8",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["metricforge.*"]
ignore_missing_imports = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/metric_helpdesk"]
